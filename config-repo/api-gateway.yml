
server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # Ruta para docentes
            - id: docentes-route
              uri: lb://docentes-service
              predicates:
                - Path=/api/docentes,/api/docentes/**

            # Ruta para cursos
            - id: cursos-route
              uri: lb://cursos-service
              predicates:
                - Path=/api/cursos,/api/cursos/**

            # Ruta para inscripciones
            - id: inscripciones-route
              uri: lb://inscripciones-service
              predicates:
                - Path=/api/inscripciones,/api/inscripciones/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoint:
    gateway:
      access: read-only

  endpoints:
    web:
      exposure:
        include: health,info,gateway
