spring:
  application:
    name: eureka-server

server:
  port: 8761

eureka:
  instance:
    hostname: localhost

  client:
    register-with-eureka: false # Evita que el servidor se registre a sí mismo.
    fetch-registry: false  # Evita que intente obtener registros de otro servidor Eureka.
    service-url:
      defaultZone: http://localhost:8761/eureka/